<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plan treningowy K1 na sezon 2027 – Jakub Brzeziński">
<meta name="theme-color" content="#101A1F"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Sezon K1 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@75..100,600..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: górny pasek (marka + odliczania) i poziome zakładki; widoki w kontenerze 1240px.
   Kolory: tusz granatowy + turkus „whitewater” jako akcent; czerwień/zieleń bramek tylko jako sygnały;
   fazy i typy treningu mają pary tło/tekst (jasny i ciemny motyw). */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#EDF1F0; --ink:#14212B; --muted:#5B6A6F; --line:#C9D2D0; --shadow:0 1px 2px rgba(20,33,43,.06),0 4px 16px rgba(20,33,43,.05);
  --accent:#0E7C7B; --accent-2:#0A5E5D; --accent-soft:#E0F1F0; --on-accent:#FFFFFF;
  --red:#C62F3A; --red-soft:#FBE3E5; --green:#1E8C4E; --green-soft:#DDF1E5; --amber:#A57800; --amber-soft:#FBF1CF; --blue:#2F5E93; --blue-soft:#E3ECF7;
  --ph-T:#163C73; --ph-T-bg:#C9DAF2; --ph-P:#4F3C00; --ph-P-bg:#F8E29A; --ph-Q:#6B3204; --ph-Q-bg:#F9C79E; --ph-M:#6E0E17; --ph-M-bg:#F2A9B0; --ph-R:#12502F; --ph-R-bg:#B9E4CA;
  --t-speed:#F4A28A; --t-speed-f:#4A1100; --t-power:#F7BE8F; --t-power-f:#4F2400; --t-pe:#F6D36B; --t-pe-f:#3F2D00; --t-lt:#B9A6EC; --t-lt-f:#1E1150; --t-aer:#8FC3F0; --t-aer-f:#08294D;
  --t-tech:#7FD3C4; --t-tech-f:#063B35; --t-kx:#F2C94C; --t-kx-f:#382A00; --t-sc:#9FB0DE; --t-sc-f:#141F47; --t-comp:#B3202C; --t-comp-f:#FFFFFF; --t-off:#D3D9DC; --t-off-f:#3A4549;
  --t-heat:#F5A77A; --t-heat-f:#451B00; --t-test:#8FB3F0; --t-test-f:#0A285F; --t-demo:#F2B8BE; --t-demo-f:#560D16;
  --i-HIGH:#D9431E; --i-MEDIUM:#E0A800; --i-LOW:#2E9A62; --i-OFF:#AAB5B9; --i-COMP:#8E1520;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#151E23; --surface-2:#1B262C; --ink:#E6EDEF; --muted:#98A7AC; --line:#26343B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --accent:#3FC1B8; --accent-2:#7AD7D0; --accent-soft:#12302F; --on-accent:#06201F;
  --red:#F06872; --red-soft:#3A1A1E; --green:#55CC8A; --green-soft:#16301F; --amber:#F0C63C; --amber-soft:#342B10; --blue:#7FA8E0; --blue-soft:#18263A;
  --ph-T:#8FB3E6; --ph-T-bg:#18263A; --ph-P:#EFCB5C; --ph-P-bg:#302710; --ph-Q:#F3A265; --ph-Q-bg:#352315; --ph-M:#F27B84; --ph-M-bg:#3A1A1E; --ph-R:#6DD49A; --ph-R-bg:#15301F;
  --t-speed:#46231A; --t-speed-f:#FFB8A3; --t-power:#44291A; --t-power-f:#FFC49E; --t-pe:#3E3314; --t-pe-f:#F5D27A; --t-lt:#2E2542; --t-lt-f:#CDB6F0; --t-aer:#16293C; --t-aer-f:#9CC8F0;
  --t-tech:#123330; --t-tech-f:#8EDFD2; --t-kx:#3A3112; --t-kx-f:#F2D67A; --t-sc:#1F2740; --t-sc-f:#B4C2EE; --t-comp:#B0222E; --t-comp-f:#FFFFFF; --t-off:#1D272C; --t-off-f:#8D9CA1;
  --t-heat:#44291A; --t-heat-f:#FFC49E; --t-test:#172A48; --t-test-f:#9EC0F5; --t-demo:#3A1A1E; --t-demo-f:#F7A8AF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#151E23; --surface-2:#1B262C; --ink:#E6EDEF; --muted:#98A7AC; --line:#26343B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --accent:#3FC1B8; --accent-2:#7AD7D0; --accent-soft:#12302F; --on-accent:#06201F;
  --red:#F06872; --red-soft:#3A1A1E; --green:#55CC8A; --green-soft:#16301F; --amber:#F0C63C; --amber-soft:#342B10; --blue:#7FA8E0; --blue-soft:#18263A;
  --ph-T:#8FB3E6; --ph-T-bg:#18263A; --ph-P:#EFCB5C; --ph-P-bg:#302710; --ph-Q:#F3A265; --ph-Q-bg:#352315; --ph-M:#F27B84; --ph-M-bg:#3A1A1E; --ph-R:#6DD49A; --ph-R-bg:#15301F;
  --t-speed:#46231A; --t-speed-f:#FFB8A3; --t-power:#44291A; --t-power-f:#FFC49E; --t-pe:#3E3314; --t-pe-f:#F5D27A; --t-lt:#2E2542; --t-lt-f:#CDB6F0; --t-aer:#16293C; --t-aer-f:#9CC8F0;
  --t-tech:#123330; --t-tech-f:#8EDFD2; --t-kx:#3A3112; --t-kx-f:#F2D67A; --t-sc:#1F2740; --t-sc-f:#B4C2EE; --t-comp:#B0222E; --t-comp-f:#FFFFFF; --t-off:#1D272C; --t-off-f:#8D9CA1;
  --t-heat:#44291A; --t-heat-f:#FFC49E; --t-test:#172A48; --t-test-f:#9EC0F5; --t-demo:#3A1A1E; --t-demo-f:#F7A8AF; color-scheme:dark}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px 20px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.gates{display:flex;gap:3px}
.gates i{width:7px;height:28px;border-radius:2px;background:repeating-linear-gradient(180deg,var(--green) 0 7px,var(--surface) 7px 10px)}
.gates i+i{background:repeating-linear-gradient(180deg,var(--red) 0 7px,var(--surface) 7px 10px)}
.brand h1{font:700 clamp(22px,3vw,28px)/1 var(--display);letter-spacing:.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.2 var(--body);color:var(--muted);letter-spacing:.02em}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.cd{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.cd b{font:700 18px/1 var(--display);color:var(--ink)}
.cd.red b{color:var(--red)} .cd.q b{color:var(--ph-Q)}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font:600 14px/1 var(--body);letter-spacing:.02em;padding:11px 12px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:24px 64px}
.view[hidden]{display:none}
h2{font:700 30px/1.1 var(--display);margin:0 0 6px;letter-spacing:.005em;text-wrap:balance}
h3{font:700 20px/1.2 var(--display);margin:0 0 8px;letter-spacing:.01em}
.lead{color:var(--muted);max-width:72ch;margin:0 0 20px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;white-space:nowrap}
.ph{font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;display:inline-block;white-space:nowrap}
.ph-T{background:var(--ph-T-bg);color:var(--ph-T)} .ph-P{background:var(--ph-P-bg);color:var(--ph-P)} .ph-Q{background:var(--ph-Q-bg);color:var(--ph-Q)} .ph-M{background:var(--ph-M-bg);color:var(--ph-M)} .ph-R{background:var(--ph-R-bg);color:var(--ph-R)}
.typ{display:inline-block;font:700 11px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:6px;white-space:nowrap}
.ty-SPEED{background:var(--t-speed);color:var(--t-speed-f)} .ty-POWER{background:var(--t-power);color:var(--t-power-f)} .ty-PE{background:var(--t-pe);color:var(--t-pe-f)}
.ty-LT,.ty-LACTATE{background:var(--t-lt);color:var(--t-lt-f)} .ty-AEROBIC{background:var(--t-aer);color:var(--t-aer-f)} .ty-TECH{background:var(--t-tech);color:var(--t-tech-f)}
.ty-KX{background:var(--t-kx);color:var(--t-kx-f)} .ty-SC{background:var(--t-sc);color:var(--t-sc-f)} .ty-COMP{background:var(--t-comp);color:var(--t-comp-f)}
.ty-OFF,.ty-ALT,.ty-TRAVEL{background:var(--t-off);color:var(--t-off-f)} .ty-HEAT{background:var(--t-heat);color:var(--t-heat-f)} .ty-TEST{background:var(--t-test);color:var(--t-test-f)}
.ty-DEMO{background:var(--t-demo);color:var(--t-demo-f)} .ty-WYR{background:var(--green-soft);color:var(--green)}
.int{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--mono);letter-spacing:.04em;color:var(--muted)}
.int::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--i-OFF)}
.int.HIGH::before{background:var(--i-HIGH)} .int.MEDIUM::before{background:var(--i-MEDIUM)} .int.LOW::before{background:var(--i-LOW)} .int.COMP::before{background:var(--i-COMP)}
.st{font:600 12px/1 var(--body);padding:5px 8px;border-radius:6px;white-space:nowrap}
.st-C{background:var(--green-soft);color:var(--green)} .st-T{background:var(--amber-soft);color:var(--amber)} .st-P{background:var(--blue-soft);color:var(--blue)}
.prio{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font:700 14px/1 var(--display)}
.prio-A{background:var(--red);color:#fff} .prio-B{background:var(--ph-Q-bg);color:var(--ph-Q)} .prio-C{background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.alert{border-left:4px solid var(--red);background:var(--surface);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.alert.info{border-left-color:var(--accent)}
.alert h4{margin:0 0 4px;font:700 17px/1.2 var(--display)}
/* dashboard */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font:700 40px/1 var(--display);margin:6px 0 4px}
.kpi.red b{color:var(--red)} .kpi.q b{color:var(--ph-Q)} .kpi.a b{color:var(--accent)}
.kpi span{font-size:13px;color:var(--muted)}
.next{display:flex;flex-direction:column;gap:10px}
.nx{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.nx:first-child{border-top:0}
.nx .dd{font:700 22px/1 var(--display);text-align:center}
.nx .dd small{display:block;font:600 11px/1.2 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.nx .nm{font-weight:600;line-height:1.25}
.nx .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.progress{margin-top:6px}
.strip{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.strip button{border:0;padding:0;flex:1;cursor:pointer;position:relative;min-width:0}
.strip button.now{box-shadow:inset 0 0 0 2px var(--ink)}
.strip button:hover{filter:brightness(.95)}
.strip .T{background:var(--ph-T-bg)} .strip .P{background:var(--ph-P-bg)} .strip .Q{background:var(--ph-Q-bg)} .strip .M{background:var(--ph-M-bg)} .strip .R{background:var(--ph-R-bg)}
.strip i{position:absolute;inset:auto 0 3px 0;margin:auto;width:6px;height:6px;border-radius:50%;background:var(--red)}
.striplab{display:flex;justify-content:space-between;font:600 11px/1 var(--mono);color:var(--muted);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.peaks{display:grid;gap:10px}
.peak{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.peak .n{font:700 28px/1 var(--display);color:var(--accent)}
/* sesja */
.ses{display:grid;gap:8px;padding:14px 16px;border-radius:10px;background:var(--surface-2)}
.ses .lbl{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ses .z{font:500 15px/1.4 var(--body)}
.ses.off .z{color:var(--muted)}
/* tydzień */
.weekhead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
@media (max-width:760px){.weekhead{grid-template-columns:1fr}}
.weekhead>*{min-width:0}
.wkpick{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;min-width:0}
.wkpick select{flex:1;min-width:0;width:100%}
.eyebrow{overflow-wrap:anywhere}
.wkpick select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;max-width:100%}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 18px;margin-top:14px}
.kv div{min-width:0}
.kv dt{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.kv dd{margin:0;font-weight:500}
.days{display:grid;gap:16px;margin-top:22px}
.day{display:grid;grid-template-columns:140px 1fr 1fr;gap:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border-left:5px solid var(--i-OFF)}
.day.HIGH{border-left-color:var(--i-HIGH)} .day.MEDIUM{border-left-color:var(--i-MEDIUM)} .day.LOW{border-left-color:var(--i-LOW)} .day.COMP{border-left-color:var(--i-COMP)}
.day.today{outline:2px solid var(--accent);outline-offset:2px}
.day .dh{display:flex;flex-direction:column;gap:6px}
.day .dow{font:700 22px/1 var(--display)}
.day .date{font:600 13px/1 var(--mono);color:var(--muted)}
.day .tags{display:flex;flex-direction:column;gap:5px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.day .note{grid-column:2/-1;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.day .note label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink);font-weight:600}
@media (max-width:760px){.day{grid-template-columns:1fr}.day .dh{flex-direction:row;align-items:center;flex-wrap:wrap}.day .tags{flex-direction:row;flex-wrap:wrap}.day .note{grid-column:1}}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);resize:vertical}
/* gantt – czytelny: odstępy między wierszami, szersze tygodnie, zaokrąglone pasma */
.gantt{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:10px 10px 12px}
.gt{display:grid;grid-template-columns:170px repeat(54,minmax(66px,1fr));min-width:3900px;gap:5px 3px;font-size:13px}
.gt .lab{position:sticky;left:-10px;z-index:2;background:var(--surface);font:700 12px/1.25 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding:10px 12px;border-right:2px solid var(--line);display:flex;align-items:center;box-shadow:6px 0 8px -6px rgba(0,0,0,.15)}
.gt .c{padding:8px 8px;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;overflow:hidden;min-height:46px;word-break:normal;overflow-wrap:normal}
.gt .wkc{font:700 12px/1.15 var(--mono);color:var(--ink);cursor:pointer;flex-direction:column;gap:3px;background:var(--surface-2)}
.gt .wkc span{font-weight:400;color:var(--muted);font-size:11px}
.gt .wkc:hover{background:var(--accent-soft)}
.gt .wkc.now{background:var(--accent);color:var(--on-accent)} .gt .wkc.now span{color:var(--on-accent)}
.gt .mon{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--surface);justify-content:flex-start;padding-left:12px;min-height:32px}
.gt .band{font-weight:600;cursor:pointer;font-size:13px;justify-content:flex-start;text-align:left;padding-left:12px}
.gt .band:hover{filter:brightness(.96)}
.gt .ev{background:var(--red);color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.gt .evb{background:var(--ph-Q-bg);color:var(--ph-Q);font-weight:700;font-size:12px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--ph-Q)}
.gt .camp{background:var(--accent-soft);color:var(--accent-2);font-weight:600;justify-content:flex-start;padding-left:12px;text-align:left}
.gt .empty{background:repeating-linear-gradient(90deg,transparent 0 6px,color-mix(in srgb,var(--line) 35%,transparent) 6px 7px);border-radius:7px}

.gt .mi.HIGH{background:#F7C5BB;color:#8A1F12} .gt .mi.MEDIUM{background:#FCE7B0;color:#6E5200} .gt .mi.LOW,.gt .mi.DELOAD{background:#DCF0E4;color:#23784C} .gt .mi.OFF{background:var(--surface-2);color:var(--muted)} .gt .mi.COMP{background:#F8DADD;color:#B0222E}

x RPE 8, alternatywa High Pull. Kolano przy SL Leg Press ISO → bez izometrii jednonóż w głębokim zgięciu. Ograniczony wyprost lewej nogi w siadzie → bez GHD sit-up w pełnym przeproście. Lewy bark po pompkach balistycznych → mała objętość pchań balistycznych."],["Obciążenia do pilnowania","SA DB Snatch 5/str. = tętno 174 → to nie jest moc, tylko kwas. Zostawiam 3/str. Pendlay 100 kg = technika się sypie → górny limit prędkości MPV ≥0,75 m/s."],["Przerwy w Twoich plikach","Skoki i MB: 30–60\". Pochodne olimpijskie: 2'. Moc/siła: 2–3'. Ciężko (RiR 0–1, MPV <0,5): 3–5'. Cluster: 15–45\" między powtórzeniami. To są przerwy zgodne z literaturą dla mocy (pełna resynteza PCr 2–3') – zostawiam."],["VBT – strefy (Twoje)","Siła: MPV 0,4–0,6 m/s · siła-szybkość: 0,75–1,0 · szybkość-siła/moc: 1,0–1,3 · High Pull: PV 1,9–2,1 (ciężko) i 2,8–3,0 (lekko). Seria kończy się, gdy prędkość spada >10% (moc) lub >20% (siła)."],["Ocena programu trenera","Dobrze: kolejność od najszybszego, VBT ze stałymi ciężarami, cluster i PIMA w sezonie, priming przed startami, mało ekscentryki latem. Do poprawy: w 2025 dużo hipertrofii/izolacji (biceps, francuskie) w lipcu – tuż przed MŚ; seria 5/str. rwania dawała kwas zamiast mocy; brak regularnego pomiaru CMJ tym samym urządzeniem; wrzesień 2026 – spadek PV, a obciążenia na siłowni rosły (Hip Thrust 190 kg)."],["Siłownia a woda – zasady w planie","S&C w dniu szybkości: szybkość rano, siłownia po południu (dzień nerwowy). S&C w dniu wytrzymałości: siłownia rano, woda po ≥6 h. Nigdy siłownia po sesji kwasowej (LT/PE). Min. 48 h między sesjami S&C. Ciężka siła najpóźniej 72 h przed startem, potem tylko PRIMING 48 h przed. Siła max co 2 mikrocykle także w sezonie startowym (+ PIMA w primingu)."],["Częstotliwość","X–XII: 2–3 sesje/tydz. (baza siły, woda głównie tlenowa) · I–III: 2 (moc, rośnie specyfika) · IV–IX: 1–2 (moc i priming, woda najważniejsza) · tydzień deload/testy: 0–1."]],"TEST":{"d":"2025-07-22","cmj_cm":35,"rsimod":0.48,"rel_pow":29.53,"lcmj /* ===== ZGODNOŚĆ Z PLANEM: plan (akcenty miesiąca) vs wykonanie z Garmina ===== */
function focOf(t){t=String(t).toUpperCase();if(t.startsWith("COMPETITION"))return"START";if(/^(LACTATE|POWER ENDURANCE|KAYAK)/.test(t))return"BEZTL";if(t.startsWith("LT"))return"PROG";if(/^(SPEED|DEMO)/.test(t))return"SZYB";if(t.startsWith("POWER"))return"MOC";if(t.startsWith("S&C"))return"SILA";if(/^(AEROBIC|HEAT|WYR)/.test(t))return"TLEN";if(t.startsWith("TECH"))return"TECH";if(t.startsWith("TEST"))return"TEST";return"REG"}
const focS=s=>/Moc tlenowa/.test(String(s[1]))?"PROG":focOf(s[0]);
const ZB={P:["Próg / moc tlenowa","PROG"],B:["Beztlen (kwas, PE, moc)","BEZTL"],N:["Niska intensywność (tlen, technika, szybkość)","TLEN"]};
const bOfF=f=>f==="PROG"?"P":(f==="BEZTL"||f==="MOC")?"B":(f==="TLEN"||f==="TECH"||f==="SZYB")?"N":null;
const bOfHR=x=>{const c=hrClass(x)[0];return c==="VO2"||c==="LT"?"P":c==="SHORT"||c==="MIX"?"B":"N"};
const MPL=["styczeń","luty","marzec","kwiecień","maj","czerwiec","lipiec","sierpień","wrzesień","październik","listopad","grudzień"];
R.zgodnosc=()=>{const tIso=isoL(today);const st0=isoL(START);
 const M={};const mk=k=>M[k]||(M[k]={all:{P:0,B:0,N:0},plan:{P:0,B:0,N:0},gar:{P:0,B:0,N:0},sila:[0,0],hit:0,cmp:0,miss:[]});
 DAYS.map(eff).forEach(d=>{const k=d.d.slice(0,7);const m=mk(k);["am","pm"].forEach(sl=>{const f=focS(d[sl]);if(f==="SILA"){if(d.d<=tIso){m.sila[0]++;if(SCLOG[d.d+"_"+sl]&&SCLOG[d.d+"_"+sl].done)m.sila[1]++}return}const b=bOfF(f);if(!b)return;m.all[b]++;if(d.d<=tIso)m.plan[b]++})});
 hrAll().filter(x=>x.d>=st0&&x.d<=tIso).forEach(x=>{const p=planOf(x);if(p&&focS(p)==="SILA")return;const m=mk(x.d.slice(0,7));const g=bOfHR(x);m.gar[g]++;const pb=p?bOfF(focS(p)):null;if(!pb)return;m.cmp++;if(pb===g)m.hit++;else m.miss.push({x,pb,g})});
 const pc=(o,b)=>{const t=o.P+o.B+o.N;return t?Math.round(100*o[b]/t):null};
 const bar=o=>`<div class="zbar">${["P","B","N"].map(b=>{const v=pc(o,b);return v?`<span style="flex:${v};background:${fcol(ZB[b][1])}" title="${ZB[b][0]} ${v}%"></span>`:""}).join("")}</div>`;
 const months=Object.keys(M).sort().filter(k=>k>=st0.slice(0,7)&&k<=tIso.slice(0,7));
 const card=k=>{const m=M[k];const [y,mm]=k.split("-");const nG=m.gar.P+m.gar.B+m.gar.N;
  const rows=["P","B","N"].map(b=>{const a=pc(m.all,b),pl=pc(m.plan,b),g=pc(m.gar,b);const dlt=g!=null&&pl!=null?g-pl:null;
   return `<tr><td><i class="sw" style="background:${fcol(ZB[b][1])}"></i> ${ZB[b][0]}</td><td class="n">${a??"–"}%</td><td class="n">${pl??"–"}%</td><td class="n">${g==null?"–":g+"%"}</td><td class="n ${dlt==null?"":Math.abs(dlt)<=10?"zok":"zbad"}">${dlt==null?"–":(dlt>0?"+":"")+dlt+" pp"}</td></tr>`}).join("");
  const miss=m.miss.slice(0,8).map(q=>{const lab=q.pb==="P"&&q.g==="N"?"plan: próg → tętno nie doszło do progu":q.pb==="N"&&q.g!=="N"?"plan: lekko → wyszło za mocno":q.pb==="B"&&q.g==="N"?"plan: beztlen → za mało mocnych odcinków w tętnie":`plan: ${ZB[q.pb][0]} → Garmin: ${ZB[q.g][0]}`;return `<li><a href="#tydzien/${DAYS.find(d=>d.d===q.x.d)?.w??curW}">${f2(pd(q.x.d))} ${q.x.slot==="am"?"rano":"popoł."}</a> – ${lab} (min. powyżej 150: ${min150(q.x)})</li>`}).join("");
  return `<div class="card" style="margin-top:14px"><div class="eyebrow">${MPL[+mm-1]} ${y}</div>
  <div style="overflow-x:auto"><table class="zgt"><thead><tr><th>Rodzaj pracy</th><th>Cel miesiąca</th><th>Plan do dziś</th><th>Garmin – wykonane</th><th>Różnica</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="grid g2" style="margin-top:10px;gap:10px"><div><div class="mini">Plan do dziś</div>${bar(m.plan)}</div><div><div class="mini">Wykonane wg tętna (${nG} sesji)</div>${bar(m.gar)}</div></div>
  <p style="margin:10px 0 0">Jednostki trafione w cel (rodzaj pracy z tętna = plan): <b>${m.cmp?Math.round(100*m.hit/m.cmp)+"%":"–"}</b> (${m.hit}/${m.cmp}) · siłownia odhaczona: <b>${m.sila[1]}/${m.sila[0]}</b></p>
  ${miss?`<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:700">Rozjazdy z planem (${m.miss.length})</summary><ul class="clean">${miss}</ul></details>`:""}</div>`};
 return el(`<h2>Zgodność z planem</h2><p class="lead">Czy to, co zrobiłeś (tętno z Garmina), zgadza się z akcentami miesiąca w planie. Liczę sesje, nie czas – tak samo jak w periodyzacji.</p>

/* ===== SIŁOWNIA (S&C) – część tego samego systemu: plan, woda, odczucia, Garmin, zdarzenia ===== */
const SCD=DATA.SC; const SCX=SCD.EX, SCS=SCD.SESS;
let SCLOG={}; try{SCLOG=JSON.parse(st("sclog")||"{}")}catch(e){SCLOG={}}
let SCSHOWDEL=false, SCEDIT=false;
async function scSave(id,obj){if(obj===null)delete SCLOG[id];else SCLOG[id]=obj;st("sclog",JSON.stringify(SCLOG));
 const ok=await dbw("sclog/"+id,obj);if(!ok)toast("Brak zasięgu – zapisane w telefonie, wyślę gdy wróci internet");return ok}
const scNum=v=>{if(v===""||v==null)return null;const x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x};
const scF=(x,d=2)=>x==null?"—":x.toFixed(d).replace(".",",");
const scFd=s=>{const d=pd(s);return `${d.getDate()}.${String(d.getMonth()+1).padStart(2,"0")}`};
const scFdy=s=>scFd(s)+"."+s.slice(2,4);
const scDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
function scKey(z,d){const u=String(z).toUpperCase();const mp={"2026-10-01":"MP1","2026-10-06":"MP2","2026-10-14":"PRIMING"};if(mp[d])return mp[d];
 if(u.includes("PRIMING"))return"PRIMING";if(u.includes("TAPER"))return"TAPER";if(/HYBRYD|ROZTREN|UTRZYMANIE|MOBILN/.test(u))return"HYBRYD";
 if(u.includes("RE-ADAPTACJA → HIPERTROFIA"))return pd(d).getDay()>=4||pd(d).getDay()===0?"HIPER":"READ";if(u.includes("RE-ADAPTACJA"))return"READ";if(u.includes("HIPERTROFIA"))return"HIPER";
 if(u.includes("ISO OVERCOMING")||u.includes("MOC + MIKRODAWKOWANIE SIŁY"))return"MOC_ISO";if(u.includes("RPA")||u.includes("PEAK POWER"))return"RPA";
 if((u.includes("SIŁA MAX")&&u.includes("MOC"))||u.includes("MAXIMAL STRENGTH"))return"SMAX_MOC";if(u.includes("SIŁA MAX"))return"SMAX";return"MOC"}
/* sesje siłowe wynikają z AKTUALNEGO planu (po Twoich zmianach i zmianach asystenta) */
function scSessions(){const out=[];DAYS.forEach(b=>{const d=eff(b);["am","pm"].forEach(p=>{const id=d.d+"_"+p;const base=b[p][0]==="S&C",now=d[p][0]==="S&C";
  if(now){const det=d[p+"d"]||{};out.push({id,d:d.d,pora:p,k:det.sck||scKey(d[p][1],d.d),z:d[p][1],meso:d.sc||"",day:d})}
  else if(base){out.push({id,d:d.d,pora:p,k:(b[p+"d"]||{}).sck||scKey(b[p][1],b.d),z:b[p][1],meso:b.sc||"",day:d,removed:true,why:d[p][1]})}})});
 Object.entries(SCLOG).forEach(([id,L])=>{if(L.own&&!out.some(s=>s.id===id))out.push({id,d:L.d,pora:L.pora,k:L.k,z:"sesja dodatkowa",meso:"dodana ręcznie",own:true,day:eff(DAYS.find(x=>x.d===L.d)||DAYS[0])})});
 return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.pora<b.pora?-1:1)}
function scPoints(e){const out=SCD.HIST.filter(h=>h.e===e).map(h=>({...h,src:"plik",set:0}));
 for(const id in SCLOG){const L=SCLOG[id];(((L.ex||{})[e])||[]).forEach((s,i)=>{if(s.kg==null&&s.mpv==null&&s.pv==null&&!s.r)return;out.push({e,d:L.d,kg:s.kg??0,r:s.r??null,mpv:s.mpv,pv:s.pv,rpe:s.rpe,u:"",src:"dziennik",set:i+1,id})})}
 return out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.set-b.set)}
const scMx=a=>{const b=a.filter(x=>x!=null);return b.length?Math.max(...b):null};
function scByDay(P){const m={};P.forEach(p=>{(m[p.d]=m[p.d]||[]).push(p)});return Object.entries(m).map(([d,a])=>({d,a,top:Math.max(...a.map(p=>p.kg||0)),mpv:scMx(a.map(p=>p.mpv)),pv:scMx(a.map(p=>p.pv)),src:a.some(p=>p.src==="dziennik")?"dziennik":"plik"}))}
function scFit(P){const p=P.filter(x=>x.mpv!=null&&x.kg>0);if(p.length<3||new Set(p.map(x=>x.kg)).size<2)return null;const mk=avg(p.map(x=>x.kg)),my=avg(p.map(x=>x.mpv));let sxy=0,sxx=0;
 p.forEach(x=>{sxy+=(x.kg-mk)*(x.mpv-my);sxx+=(x.kg-mk)**2});const b=sxy/sxx,a=my-b*mk;if(b>=0)return null;const ss=p.reduce((s,x)=>s+(x.mpv-(a+b*x.kg))**2,0),stt=p.reduce((s,x)=>s+(x.mpv-my)**2,0);return{a,b,r2:stt?1-ss/stt:0}}
function scVerdict(e,upTo){let P=scPoints(e);if(upTo)P=P.filter(p=>p.d<=upTo);const D=scByDay(P);if(!D.length)return{txt:"Brak danych",cls:"fl",arrow:"·",detail:[],score:0};
 const last=D[D.length-1],prev=D.slice(0,-1),det=[];let score=0;const vk=SCX[e].met==="PV"?"pv":"mpv";const lv=last.a.filter(p=>p[vk]!=null);
 if(lv.length){const cmp=[];lv.forEach(p=>{const same=P.filter(q=>q.d<last.d&&q[vk]!=null&&Math.abs((q.kg||0)-(p.kg||0))<=2.5);if(same.length){const ref=avg(same.slice(-3).map(q=>q[vk]));cmp.push((p[vk]-ref)/ref*100)}});
  if(cmp.length){const c=avg(cmp);score+=c;det.push(`prędkość przy tym samym ciężarze ${c>=0?"+":""}${scF(c,1)}%`)}
  else{const F=scFit(P.filter(q=>q.d<last.d));if(F&&vk==="mpv"){const c=avg(lv.map(p=>(p.mpv-(F.a+F.b*p.kg))/(F.a+F.b*p.kg)*100));score+=c;det.push(`prędkość vs Twój profil siła–prędkość ${c>=0?"+":""}${scF(c,1)}%`)}}
  if(lv.length>=2&&last.src==="dziennik"){const s1=lv[0][vk],sN=lv[lv.length-1][vk],drop=(s1-sN)/s1*100;det.push(drop>10?`⚠ spadek prędkości w sesji ${scF(drop,0)}% – zmęczenie`:`spadek w sesji ${scF(Math.max(drop,0),0)}% – OK`);if(drop>10)score-=2}}
 if(last.top>0&&prev.length){const best=Math.max(...prev.map(x=>x.top));if(last.top>best){det.push(`rekord ciężaru ${scF(last.top,1)} kg`);score+=3}}
 const cls=score>3?"up":score<-3?"dn":"fl";return{txt:cls==="up"?"Wzrost":cls==="dn"?"Spadek":"Stabilnie",cls,arrow:cls==="up"?"▲":cls==="dn"?"▼":"■",detail:det,last,score}}
function scCmj(dateIso){const P=scPoints("cmj").filter(p=>p.pv!=null&&p.d<=dateIso);if(!P.length)return null;const D=scByDay(P);const last=D[D.length-1];const ref=D.slice(-6,-1).map(x=>x.pv);
 return{last,age:scDays(last.d,dateIso),d:ref.length?(last.pv-avg(ref))/avg(ref)*100:null}}
function scTrendDown(dateIso){const from=isoL(addD(pd(dateIso),-10));const ex=new Set();Object.values(SCLOG).forEach(L=>{if(L.d>=from&&L.d<=dateIso&&!L.deleted)Object.keys(L.ex||{}).forEach(e=>ex.add(e))});
 return [...ex].filter(e=>e!=="cmj"&&scVerdict(e,dateIso).cls==="dn")}
function scLoad(dateIso){let s=0,has=false;Object.values(SCLOG).forEach(L=>{if(L.d===dateIso&&L.done&&!L.deleted){has=true;s+=(L.dur||60)*(L.rpe??6)}});return has?s:null}

function scChart(e){const D=scByDay(scPoints(e));if(D.length<2)return `<p class="muted">Za mało punktów na wykres.</p>`;const W_=720,H_=250,L=46,Rr=46,T=16,B=34;const t0=pd(D[0].d),t1=pd(D[D.length-1].d),span=Math.max(1,t1-t0);
 const X=d=>L+(pd(d)-t0)/span*(W_-L-Rr);const vk=SCX[e].met==="PV"?"pv":"mpv";const kg=D.map(x=>x.top).filter(x=>x>0),vs=D.map(x=>x[vk]).filter(x=>x!=null);
 const kmax=kg.length?Math.max(...kg)*1.1:1,kmin=kg.length?Math.min(...kg)*.85:0,Yk=k=>T+(1-(k-kmin)/(kmax-kmin||1))*(H_-T-B);const vmax=vs.length?Math.max(...vs)*1.08:1,vmin=vs.length?Math.min(...vs)*.9:0,Yv=x=>T+(1-(x-vmin)/(vmax-vmin||1))*(H_-T-B);
 let g="";for(let i=0;i<=4;i++){const y=T+i*(H_-T-B)/4;g+=`<line x1="${L}" x2="${W_-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/>`;if(kg.length)g+=`<text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(kmax-(kmax-kmin)*i/4)}</text>`;if(vs.length)g+=`<text x="${W_-Rr+6}" y="${y+4}">${scF(vmax-(vmax-vmin)*i/4)}</text>`}
 const tk=D.filter((x,i)=>i===0||i===D.length-1||i%Math.ceil(D.length/6)===0).map(x=>`<text x="${X(x.d)}" y="${H_-10}" text-anchor="middle">${scFdy(x.d)}</text>`).join("");
 const kl=D.filter(x=>x.top>0),vl=D.filter(x=>x[vk]!=null);const path=(a,fx,fy)=>a.map((p,i)=>(i?"L":"M")+fx(p).toFixed(1)+","+fy(p).toFixed(1)).join("");
 return `<div class="leg"><span><i style="background:var(--c1)"></i>ciężar szczytowy dnia [kg]</span>${vs.length?`<span><i style="background:var(--c2)"></i>najlepsza ${vk.toUpperCase()} [m/s]</span>`:""}<span>● dziennik · ○ Twoje pliki</span></div>
 <svg class="scsvg" viewBox="0 0 ${W_} ${H_}" style="width:100%;height:auto" role="img" aria-label="Ciężar i prędkość w czasie">${g}${tk}
 ${kl.length>1?`<path d="${path(kl,p=>X(p.d),p=>Yk(p.top))}" fill="none" stroke="var(--c1)" stroke-width="2.5"/>`:""}${kl.map(p=>`<circle cx="${X(p.d)}" cy="${Yk(p.top)}" r="4.5" fill="${p.src==="dziennik"?"var(--c1)":"var(--surface)"}" stroke="var(--c1)" stroke-width="2"><title>${scFdy(p.d)}: ${scF(p.top,1)} kg</title></circle>`).join("")}
 ${vl.length>1?`<path d="${path(vl,p=>X(p.d),p=>Yv(p[vk]))}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-dasharray="5 4"/>`:""}${vl.map(p=>`<rect x="${X(p.d)-4}" y="${Yv(p[vk])-4}" width="8" height="8" fill="${p.src==="dziennik"?"var(--c2)":"var(--surface)"}" stroke="var(--c2)" stroke-width="2"><title>${scFdy(p.d)}: ${scF(p[vk])} m/s</title></rect>`).join("")}</svg>`}
function scLV(e){const P=scPoints(e).filter(p=>p.mpv!=null&&p.kg>0);if(P.length<2)return"";const F=scFit(P),mvt=SCD.MVT[e];const W_=720,H_=230,L=46,Rr=16,T=12,B=34;const kmax=Math.max(...P.map(p=>p.kg))*1.15,vmax=Math.max(...P.map(p=>p.mpv),mvt||0)*1.1;
 const X=k=>L+k/kmax*(W_-L-Rr),Y=x=>T+(1-x/vmax)*(H_-T-B);let g="";for(let i=0;i<=4;i++){const y=T+i*(H_-T-B)/4;g+=`<line x1="${L}" x2="${W_-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${scF(vmax*(1-i/4))}</text><text x="${X(kmax*i/4)}" y="${H_-10}" text-anchor="middle">${Math.round(kmax*i/4)} kg</text>`}

function lineChart(opt){const W_=720,H_=260,L=44,Rr=86,T=16,B=30;const all=opt.series.flatMap(s=>s.pts);
 const xs=all.map(p=>pd(p[0]).getTime());const x0=Math.min(...xs),x1=Math.max(...xs);
 const ys=all.map(p=>p[1]).concat((opt.refs||[]).map(r=>r.y));let y0=Math.min(...ys),y1=Math.max(...ys);
 const raw=(y1-y0)/4;const st=[0.05,0.1,0.2,0.25,0.5,1,2,5,10,20,50].find(s=>s>=raw)||raw;y0=Math.floor((y0-st*0.3)/st)*st;y1=Math.ceil((y1+st*0.3)/st)*st;
 const X=t=>L+(t-x0)/(x1-x0)*(W_-L-Rr), Y=v=>T+(1-(v-y0)/(y1-y0))*(H_-T-B);
 const ticks=[];for(let v=y0;v<=y1+1e-9;v+=st)ticks.push(v);
 const years=[];for(let y=new Date(x0).getFullYear()+1;y<=new Date(x1).getFullYear();y++)years.push(y);
 let g=ticks.map(v=>`<line class="grid" x1="${L}" x2="${W_-Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${opt.fmt(v)}</text>`).join("");
 g+=years.filter(y=>y%2===0||y===2025).map(y=>{const t=new Date(y,0,1).getTime();return `<text x="${X(t)}" y="${H_-8}" text-anchor="middle">${y}</text>`}).join("");
 g+=(opt.refs||[]).map(r=>`<line class="ref" x1="${L}" x2="${W_-Rr}" y1="${Y(r.y)}" y2="${Y(r.y)}"/><text class="lab" x="${W_-Rr-4}" y="${Y(r.y)-6}" text-anchor="end" style="font-weight:600;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px">${esc(r.label)}</text>`).join("");
 const ser=opt.series.map(s=>{const pts=s.pts.map(p=>[X(pd(p[0]).getTime()),Y(p[1]),p]);
  let path="",gaps="";pts.forEach((p,k)=>{if(!k){path+="M"+p[0].toFixed(1)+" "+p[1].toFixed(1);return}const q=pts[k-1];const far=(pd(p[2][0])-pd(q[2][0]))/864e5>700;
   if(far){gaps+=`<path d="M${q[0]} ${q[1]} L${p[0]} ${p[1]}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="3 5" opacity=".7"/>`;path+=" M"+p[0].toFixed(1)+" "+p[1].toFixed(1)}else path+=" L"+p[0].toFixed(1)+" "+p[1].toFixed(1)});const last=pts[pts.length-1];
  return gaps+`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join("")
   +`<text class="lab" x="${last[0]+8}" y="${last[1]+(s.dy||4)}">${esc(s.short||s.name)} ${opt.fmt(last[2][1])}</text>`
   +pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="transparent" data-tip="${esc(s.name)} · ${f3(pd(p[2][0]))}: ${opt.fmt(p[2][1])} ${opt.unit}"/>`).join("")}).join("");
 return `<div class="chartwrap"><svg class="lc" viewBox="0 0 ${W_} ${H_}" role="img" aria-label="${esc(opt.aria)}">${g}${ser}</svg><div class="tip"></div></div>`}
function wireTips(root){root.querySelectorAll(".chartwrap").forEach(cw=>{const tip=cw.querySelector(".tip");const svg=cw.querySelector("svg");
 svg.addEventListener("pointermove",e=>{const t=e.target.closest("[data-tip]");if(!t){tip.style.display="none";return}const r=cw.getBoundingClientRect();tip.textContent=t.dataset.tip;tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";tip.style.display="block"});
 svg.addEventListener("pointerleave",()=>tip.style.display="none")})}

 <div class="card kcard" style="margin-bottom:16px"><div class="eyebrow">Najważniejsze teraz (stan 7.10.2026)</div><ul class="clean">
 <li><b>Mocne strony:</b> pojemność beztlenowa, siła ciągu, tolerancja ostrych bodźców. <b>Utrzymuj, nie dokładaj kwasu.</b></li>
 <li><b>Główna rezerwa:</b> próg i moc tlenowa <b>w łodzi slalomowej</b> – w zjazdówce dochodzisz do tętna, w slalomówce rzadko.</li>
 <li><b>Po szybkości i mocy</b> masz dobre HRV, ale czujesz się ospały w technice – technika przed szybkością albo po krótkim bodźcu beztlenowym.</li>
 <li><b>Przed startem</b> potrzebujesz bodźca beztlenowego (10/20/40/20/10 na 48–72 h, krótkie 30–40″ w rozgrzewce), żeby wejść na tętno i pobudzenie.</li>
 <li><b>Do zmierzenia:</b> krzywa Wingate (T1), przyspieszenie łodzi 0–15 m, międzyczasy przejazdów, test 3×6′ slalomówka vs zjazdówka (21–27.10).</li></ul></div>

/* ===== Analiza tętna z każdego treningu (Garmin, sekunda po sekundzie) ===== */
const HRZ=[["Z1",0,120],["Z2",120,135],["Z3",135,150],["Z4",150,162],["Z5",162,999]];
function hrAll(){const o={};(DATA.HRS||[]).forEach(x=>o[x.id]=x);for(const k in HRDB)o[k]=HRDB[k];return Object.values(o).sort((a,b)=>(a.d+a.t)<(b.d+b.t)?1:-1)}
const SERC=new Map();function hrSer(x){const k=String(x.id);if(SERC.has(k))return SERC.get(k);let bin="";try{bin=atob(x.s||"")}catch(e){}const hr=[],sp=[];for(let i=0;i+1<bin.length;i+=2){hr.push(bin.charCodeAt(i));sp.push(bin.charCodeAt(i+1)/20)}const r={hr,sp};SERC.set(k,r);return r}
const hrMed=a=>{a=a.filter(v=>v!=null).sort((p,q)=>p-q);return a.length?a[Math.floor(a.length/2)]:null};
function hrClass(x){const b=x.b||[],T=x.dur||1,z=x.Z||[0,0,0,0,0],hi=(z[3]+z[4])/T;
 const lng=b.filter(q=>q[1]>=150),sh=b.filter(q=>q[1]>=20&&q[1]<110&&q[2]>=160);
 if(lng.length>=3&&lng.filter(q=>q[2]>=168).length>=2)return["VO2","Interwały długie / moc tlenowa"];
 if(lng.length>=2)return["LT","Próg / odcinki długie"];
 if(sh.length>=4)return["SHORT","Krótkie intensywne (trasa, PE, kwas)"];
 if(hi>0.08)return["MIX","Mieszany"];
 return["LOW","Niska intensywność (tlen, technika, krótka szybkość)"]}
function hrBase(x){// wartości odniesienia z 90 dni przed sesją
 const lo=isoL(addD(pd(x.d),-90));const prev=hrAll().filter(y=>y.d<x.d&&y.d>=lo);
 const rec=[],t170=[],pk=[];prev.forEach(y=>(y.b||[]).forEach(q=>{if(q[2]>=160&&q[1]<=150&&q[5]!=null)rec.push(q[5]);if(q[6]!=null&&q[1]>=150)t170.push(q[6]);if(q[1]>=20&&q[1]<110)pk.push(q[2])}));
 return{rec:hrMed(rec),t170:hrMed(t170),pk:hrMed(pk),n:prev.length}}
/* Zasada (7.10.2026): cel fizjologiczny (próg, moc tlenowa) – tam, gdzie dochodzisz do tętna. Slalomówka bez progu → przenosimy do zjazdówki. */
const BOATN={slalom:"Slalomówka",zjazd:"Zjazdówka",inne:"Ergometr / inne"};
function planOf(x){const day=DAYS.find(d=>d.d===x.d);if(day)return eff(day)[x.slot];const r=DATA.PVA&&DATA.PVA.rows.find(r=>r[4]===x.id||(r[0]===x.d&&r[1]===x.slot));return r?[r[2],r[3]]:null}
function isPhys(p){if(!p)return false;const t=tcls(p[0]),z=String(p[1]||"");return t==="LT"||(t==="AEROBIC"&&/Moc tlenowa|[24] ?mmol|próg|VO|P2/i.test(z))}
function boatOf(x,p){const o=(OV[x.d]||{}).boat||{};if(o[x.slot])return o[x.slot];if(x.lodz)return x.lodz;const z=String(p&&p[1]||"");
 if(/zjazd/i.test(z))return"zjazd";if(/ergometr|airbike|Bieg|rower|Narty/i.test(z))return"inne";return"slalom"}
const min150=x=>Math.round((((x.Z||[])[3]||0)+((x.Z||[])[4]||0))/60);
function boatStats(){const r={slalom:[],zjazd:[],inne:[]};hrAll().forEach(x=>{if(x.d<"2025-10-01")return;const p=planOf(x);if(!isPhys(p))return;r[boatOf(x,p)].push({d:x.d,m:min150(x),x})});return r}
function slalomDeficitStreak(){const lim=isoL(addD(today,-45));const L=boatStats().slalom.sort((a,b)=>a.d<b.d?1:-1).slice(0,2);return L.length===2&&L.every(q=>q.m<8&&q.d>=lim)?L:null}
function hrInsights(x,plan){const out=[],b=x.b||[],T=x.dur||1,z=x.Z||[0,0,0,0,0],B=hrBase(x),pc=v=>Math.round(100*v/T);
 const pArr=Array.isArray(plan)?plan:(planOf(x)||(plan?[plan,""]:null));plan=pArr?pArr[0]:null;
 const cls=hrClass(x)[0];const pt=plan?tcls(plan):null;
 if(isPhys(pArr)){const bo=boatOf(x,pArr),m=min150(x);
  if(bo==="slalom"&&m<8)out.push({l:"a",t:`Cel tej jednostki to tętno (próg / moc tlenowa), a w slalomówce było tylko ${m} min powyżej 150 (cel ≥ 8–10). Zasada: następną taką jednostkę zrób w zjazdówce – w slalomówce zostaw zadania techniczne.`});
  else if(m>=8)out.push({l:"g",t:`Cel tętna osiągnięty: ${m} min powyżej 150 (${BOATN[bo]}).`});
  else out.push({l:"a",t:`Tylko ${m} min powyżej 150 (${BOATN[bo]}) – za mało jak na próg / moc tlenową. Sprawdź tempo i przerwy (albo pomiar z nadgarstka).`});}
 const hi=pc(z[3]+z[4]);
 out.push({l:"i",t:`Strefy kajakowe: Z1 ${pc(z[0])}% · Z2 ${pc(z[1])}% · Z3 ${pc(z[2])}% · Z4 ${pc(z[3])}% · Z5 ${pc(z[4])}% (${Math.round(T/60)} min).`});
 if(pt&&(pt==="AEROBIC"||pt==="TECH")&&hi>10)out.push({l:"a",t:`Plan: tlen/technika, a ${hi}% czasu było powyżej 150 – jednostka wyszła mocniejsza niż zamierzona.`});
 if(pt==="LT"&&!b.some(q=>q[1]>=150))out.push({l:"a",t:"Plan: próg, a nie ma ani jednego odcinka ≥ 2,5 min powyżej 150 ud/min – albo przerwy były za długie, albo tempo za niskie (sprawdź też pomiar z nadgarstka)."});
 const lng=b.filter(q=>q[1]>=150);
 if(lng.length>=2){const f=lng.slice(0,2),l=lng.slice(-2);const dA=Math.round(hrMed(l.map(q=>q[3]))-hrMed(f.map(q=>q[3])));
  out.push({l:"i",t:`${lng.length} odcinków długich: ${lng.map(q=>`${Math.round(q[1]/60*10)/10}′ śr ${q[3]}/max ${q[2]}`).join(" · ")}.`});
  if(dA>=5)out.push({l:"a",t:`Tętno w ostatnich odcinkach o ${dA} ud/min wyższe niż w pierwszych – zmęczenie narasta w trakcie (dryf). Jeśli tempo też spadło, to był górny limit tej jednostki.`});
  else out.push({l:"g",t:`Tętno między pierwszymi a ostatnimi odcinkami stabilne (${dA>=0?"+":""}${dA}) – dobrze rozłożone tempo.`});
  const tt=lng.map(q=>q[6]).filter(v=>v!=null);if(tt.length){const m=hrMed(tt);out.push({l:"i",t:`Do 170 ud/min dochodziłeś średnio po ${m} s od startu odcinka${B.t170?` (Twoja norma z 90 dni: ${B.t170} s)`:""}. Szybsze dojście przy tym samym tempie = narastające zmęczenie; wolniejsze przy wyższym tempie = lepsza kinetyka.`})}
  if(cls==="VO2"&&lng.filter(q=>q[2]>=170).length<lng.length-1)out.push({l:"a",t:"Część odcinków nie dobiła do 170 – jeśli to miało być VO₂max, tempo było za niskie albo odcinki za krótkie."});}
 const sh=b.filter(q=>q[1]<110);
 if(sh.length>=3){const p=hrMed(sh.map(q=>q[2]));out.push({l:"i",t:`${sh.length} krótkich wysiłków (${hrMed(sh.map(q=>q[1]))} s mediana), tętno szczytowe mediana ${p}${B.pk?` (norma ${B.pk})`:""}.`});
  if((pt==="PE"||pt==="LACTATE")&&p<0.9*SET.hrmax)out.push({l:"a",t:`Przy kwasie/PE tętno szczytowe zwykle ≥ ${Math.round(.9*SET.hrmax)}. ${p} oznacza krótkie odcinki albo zaniżony pomiar z nadgarstka – na takie sesje zakładaj pas.`});}
 const rc=b.filter(q=>q[2]>=160&&q[5]!=null);
 if(rc.length>=2){const m=hrMed(rc.map(q=>q[5]));const fr=rc[0][5],ls=rc[rc.length-1][5];
  out.push({l:B.rec&&m<B.rec-6?"a":B.rec&&m>B.rec+6?"g":"i",t:`Spadek tętna 60 s po wysiłku: mediana ${m} ud/min${B.rec?` (Twoja norma: ${B.rec})`:""}${B.rec&&m<B.rec-6?" – wolniej niż zwykle: zmęczenie, upał albo odwodnienie":B.rec&&m>B.rec+6?" – szybciej niż zwykle: dobra świeżość":""}.`});
  if(rc.length>=4&&fr-ls>=12)out.push({l:"a",t:`Regeneracja w przerwach słabła w trakcie sesji (${fr} → ${ls} ud/min w 60 s).`});}
 if(x.e1&&x.e2&&hi<15){const r=Math.round((x.e2/x.e1-1)*100);if(r<=-5)out.push({l:"a",t:`W drugiej połowie przy tym samym tętnie płynąłeś o ${-r}% wolniej (dryf sercowo-naczyniowy). Na płaskiej wodzie to sygnał zmęczenia/odwodnienia; na torze może wynikać z innych zadań.`});else if(r>=-2)out.push({l:"g",t:`Brak dryfu w spokojnej części (${r>=0?"+":""}${r}%) – dobra baza tlenowa w tym dniu.`});}
 if(pt==="SPEED"||pt==="POWER")out.push({l:"i",t:`Przyspieszeń wykrytych z GPS: ${x.spr||0}. Przy szybkości oceniaj po prędkości/czasie, nie po tętnie.`});
 if(x.mx&&x.mx>SET.hrmax+4)out.push({l:"a",t:`Max ${x.mx} ud/min powyżej Twojego HRmax ${SET.hrmax} – prawdopodobnie zakłócenie pomiaru z nadgarstka.`});
 return out}
function hrChart(x,h){h=h||150;const{hr,sp}=hrSer(x);const n=hr.length;if(n<2)return"";const W=640,P=28;const X=i=>P+(W-P-6)*i/(n-1);const lo=70,hi=Math.max(SET.hrmax,...hr)+2;const Y=v=>6+(h-24)*(1-(v-lo)/(hi-lo));
 const band=HRZ.slice(3).map(([nm,a,b],k)=>`<rect x="${P}" y="${Y(Math.min(b,hi))}" width="${W-P-6}" height="${Y(a)-Y(Math.min(b,hi))}" fill="${k?"var(--red)":"var(--amber)"}" opacity=".08"/>`).join("");
 const line=hr.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(Math.max(lo,v||lo)).toFixed(1)}`).join("");
 const spMax=Math.max(1,...sp);const sl=sp.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${(h-18-(h-40)*v/spMax).toFixed(1)}`).join("");
 const ticks=[120,150,162].map(v=>`<line x1="${P}" x2="${W-6}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${P-4}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join("");
 const step=x.st||15;const mins=Math.round(n*step/60);const tx=[];for(let m=0;m<=mins;m+=Math.max(5,Math.round(mins/6/5)*5))tx.push(`<text x="${X(m*60/step).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${m}′</text>`);
 return `<svg viewBox="0 0 ${W} ${h}" class="hrsvg" role="img" aria-label="Wykres tętna">${band}${ticks}<path d="${sl}" fill="none" stroke="var(--blue)" stroke-width="1" opacity=".35"/><path d="${line}" fill="none" stroke="var(--red)" stroke-width="1.6"/>${tx.join("")}</svg><div class="hrleg"><span><i style="background:var(--red)"></i>tętno</span><span><i style="background:var(--blue);opacity:.5"></i>prędkość GPS</span><span><i style="background:var(--amber);opacity:.4"></i>Z4 próg 150–162</span><span><i style="background:var(--red);opacity:.3"></i>Z5 &gt;162</span></div>`}
function hrCard(x,plan,open){const c=hrClass(x);const ins=hrInsights(x,plan);const bo=boatOf(x,planOf(x));
 return `<details class="hrc"${open?" open":""}><summary><b>${esc(x.t)}</b> · ${esc(x.n||"Kajak")} · ${Math.round(x.dur/60)}′ · śr ${x.hr??"–"} / max ${x.mx??"–"} · ${BOATN[bo]} <span class="hrtag hr-${c[0]}">${c[1]}</span></summary>${CANW?`<div class="boatsel" data-d="${x.d}" data-slot="${x.slot}"><span class="mini">Łódź:</span>${Object.entries(BOATN).map(([k,n])=>`<button type="button" class="btn sm${k===bo?" primary":""}" data-boat="${k}">${n}</button>`).join("")}</div>`:""}${hrChart(x)}<ul class="hrins">${ins.map(i=>`<li class="hl-${i.l}">${esc(i.t)}</li>`).join("")}</ul></details>`}
function hrPanel(dateIso,slot,s){const L=hrAll().filter(x=>x.d===dateIso&&x.slot===slot);if(!L.length)return"";return `<div class="hrp"><div class="eyebrow" style="margin:6px 0 2px">Analiza tętna z zegarka</div>${L.map(x=>hrCard(x,s||null,false)).join("")}</div>`}
R.treningi=(arg)=>{const all=hrAll();const f=arg||"all";const cls={all:"Wszystkie",VO2:"Interwały długie",LT:"Próg",SHORT:"Krótkie intensywne",MIX:"Mieszane",LOW:"Niska intensywność"};
 const L=all.filter(x=>f==="all"||hrClass(x)[0]===f);
 // trendy miesięczne
 const M={};all.forEach(x=>{const m=x.d.slice(0,7);const o=M[m]=M[m]||{n:0,z45:0,rec:[],t170:[]};o.n++;o.z45+=((x.Z||[])[3]||0)+((x.Z||[])[4]||0);(x.b||[]).forEach(q=>{if(q[2]>=160&&q[1]<=150&&q[5]!=null)o.rec.push(q[5]);if(q[6]!=null&&q[1]>=150)o.t170.push(q[6])})});
 const ms=Object.keys(M).sort();
 const bar=(v,mx,c)=>`<span class="hrbar"><i style="width:${Math.min(100,100*v/mx)}%;background:${c}"></i></span>`;
 const mx45=Math.max(1,...ms.map(m=>M[m].z45/60));
 const trend=`<table class="tbl"><thead><tr><th>Miesiąc</th><th>Sesje kajak</th><th>Minuty w Z4+Z5</th><th>Spadek HR 60 s po wysiłku (mediana)</th><th>Dojście do 170 (s)</th></tr></thead><tbody>${ms.map(m=>{const o=M[m];return `<tr><td>${m}</td><td>${o.n}</td><td>${Math.round(o.z45/60)} ${bar(o.z45/60,mx45,"var(--amber)")}</td><td>${hrMed(o.rec)??"–"}</td><td>${hrMed(o.t170)??"–"}</td></tr>`}).join("")}</tbody></table>`;
 const v=el(`<h2>Treningi – tętno sesja po sesji</h2><p class="lead">Każdy trening kajakowy z Garmina: wykres tętna i prędkości, strefy kajakowe, odcinki pracy, regeneracja w przerwach i wnioski. Dane od X 2025 do ostatniej synchronizacji (${all[0]?esc(all[0].d):"–"}). Nowe sesje dopiszę, gdy napiszesz „pobierz Garmin”.</p>
 <div class="card"><div class="eyebrow">Jak czytać</div><p class="muted" style="font-size:13px">Strefy: Z1 &lt;120 · Z2 120–135 · Z3 135–150 · Z4 150–162 (próg) · Z5 &gt;162. „Spadek tętna 60 s” – o ile spada tętno minutę po końcu wysiłku (więcej = szybsza regeneracja). Tętno z nadgarstka w kajaku bywa zaniżone i opóźnione – krótkie sprinty oceniaj po prędkości, a na interwały zakładaj pas piersiowy.</p></div>
 ${boatCard()}
 <div class="card" style="margin-top:12px"><div class="eyebrow">Trend miesięczny</div>${trend}</div>
 ${DATA.PVA?`<details class="card" style="margin-top:12px" open><summary style="cursor:pointer;font-weight:700;color:var(--accent)">Plan 2025/26 a to, co pokazało tętno (XI 2025 – V 2026)</summary>

/* ===== Codzienne użycie: domyślne wykonanie, szybkie oceny, Dziś, Wykonanie ===== */
const DEFDUR={SPEED:60,POWER:60,PE:65,LACTATE:70,LT:70,AEROBIC:60,TECH:60,KX:60,COMP:90,TEST:90,HEAT:45,WYR:30,ALT:40,DEMO:30};
const DEFRPE={SPEED:6,POWER:7,PE:8,LACTATE:8,LT:7,AEROBIC:3,TECH:4,KX:7,COMP:9,TEST:8,HEAT:4,WYR:2,ALT:2,DEMO:3};
function sesList(d){return ["am","pm"].map(k=>[k,d[k]]).filter(([k,s])=>s&&!["OFF","SC","TRAVEL"].includes(tcls(s[0])))}
function dStatus(d){const o=OV[d.d]||{};const past=pd(d.d)<today;
 if(o.done===false)return{k:"no",t:"Nie zrobione"+(o.why?" · "+o.why:"")};
 if(o.done===true)return{k:"ok",t:o.alt?"Zrobione inaczej niż w planie":"Zrobione wg planu"};
 if(!sesList(d).length)return{k:"off",t:"Wolne"};
 if(past)return{k:"def",t:"Zrobione wg planu (domyślnie)"};
 return{k:"plan",t:d.d===isoL(today)?"Do zrobienia dziś":"Plan"}}
function defLoad(ds){const b=DAYS.find(x=>x.d===ds);if(!b)return null;const e=eff(b);let s=0;sesList(e).forEach(([k,ss])=>{const c=tcls(ss[0]);s+=(DEFDUR[c]||60)*(DEFRPE[c]||4)});
 ["am","pm"].forEach(k=>{if(tcls(e[k][0])==="SC"){const L=SCLOG[ds+"_"+k];if(!L||!L.done)s+=60*6}});return s}
function doneBar(d){if(!CANW)return"";const s=dStatus(d);if(s.k==="off")return"";const o=OV[d.d]||{};const fut=pd(d.d)>today;
 const cls=s.k==="ok"?(o.alt?"st-alt":"st-ok"):s.k==="no"?"st-no":"st-def";
 return `<div class="stbar" data-day="${d.d}"><span class="st0 ${cls}">${s.k==="ok"||s.k==="def"?"✓ ":s.k==="no"?"✕ ":""}${esc(s.t)}</span>
 ${fut?"":`${s.k!=="ok"||o.alt?`<button class="btn sm" type="button" data-st="ok">✓ Wg planu</button>`:""}<button class="btn sm" type="button" data-st="no">✕ Nie zrobiłem</button><button class="btn sm" type="button" data-edit="${d.d}">≈ Inaczej</button>
 <span class="mini" style="margin-left:6px">Czucie / pobudzenie:</span>${[1,2,3,4,5].map(n=>`<button class="btn sm${o.czucie===n?" primary":""}" type="button" data-cz="${n}" title="1 = ospały, ciężko o technikę · 5 = pełne pobudzenie i czucie wody">${n}</button>`).join("")}`}</div>`}
document.addEventListener("click",async e=>{const b=e.target.closest(".stbar [data-st],.stbar [data-cz],.stbar [data-why],[data-feel]");if(!b)return;
 if(b.dataset.feel){const ds=isoL(today),o=OV[ds]||{};await quickSet(ds,{well:{...(o.well||{}),ogolne:+b.dataset.feel}});toast("Zapisano samopoczucie "+b.dataset.feel+"/5");route(true);return}
 const day=b.closest(".stbar").dataset.day;
 if(b.dataset.st==="ok"){await quickSet(day,{done:true,alt:false,why:null});toast("Zrobione wg planu");route(true)}
 else if(b.dataset.st==="no"){const bar=b.closest(".stbar");if(!bar.querySelector(".whys"))bar.insertAdjacentHTML("beforeend",`<span class="whys" style="display:flex;gap:6px;flex-wrap:wrap;width:100%"><span class="mini">Dlaczego?</span>${["choroba","podróż","zmęczenie","warunki / brak wody","inne"].map(w=>`<button class="btn sm" type="button" data-why="${w}">${w}</button>`).join("")}</span>`)}
 else if(b.dataset.why){const w=b.dataset.why;await quickSet(day,{done:false,why:w});if(/choroba|podróż|zmęczenie/.test(w))await saveEv("e"+Date.now().toString(36),{od:day,do:day,typ:w,opis:"niewykonany trening",ts:Date.now()});toast("Zapisano: nie zrobione – "+w);route(true)}
 else if(b.dataset.cz){await quickSet(day,{czucie:+b.dataset.cz});toast("Czucie "+b.dataset.cz+"/5");route(true)}});

/* ---------- DZIŚ ---------- */
R.pulpit=()=>{const tIso=isoL(today);const base=DAYS.find(d=>d.d===tIso)||DAYS.find(d=>pd(d.d)>=today)||DAYS[0];const ref=eff(base);const w=W[ref.w];
 const r=readiness(tIso);const o=OV[tIso]||{};const fe=(o.well||{}).ogolne;
 const tmB=DAYS.find(d=>d.d===isoL(addD(pd(ref.d),1)));const tm=tmB?eff(tmB):null;
 const yB=DAYS.find(d=>d.d===isoL(addD(today,-1)));const ye=yB?eff(yB):null;
 const nextEv=attended.filter(e=>pd(e.e||e.s)>=today).slice(0,3);
 const lw=[0,1].map(k=>{let s=0;for(let i=0;i<7;i++){const v=dayLoad(isoL(addD(today,-(i+7*k))));if(v)s+=v}return s});
 const isT=ref.d===tIso;
 const v=el(`<h2>${isT?"Dziś · ":""}${DOWL[pd(ref.d).getDay()]} ${f3(pd(ref.d))}</h2>
 <p class="lead"><b>T${ref.w+1} · ${esc(w.meso)}</b> · ${esc(w.camp)} · dzień <span class="int ${ref.i}">${ref.i}</span>${w.ev?` · <b style="color:var(--red)">${esc(w.ev)}</b>`:""}${nextEv[0]?`<br><a class="nextline" href="#zawody">Najbliższy start: <b>${esc(shortN(nextEv[0]))}</b> · za ${daysTo(pd(nextEv[0].s))} dni →</a>`:""}</p>
 <div>
  <div class="card kcard"><div class="eyebrow">Gotowość</div>
   <div class="ready"><div class="light ${r.c}">${r.c==="g"?"✓":r.c==="a"?"!":r.c==="r"?"✕":"?"}</div><div><h3 style="margin:0">${esc(r.t)}</h3>
   <div style="font-size:14.5px;margin-top:4px"><b>Woda:</b> ${esc(r.woda||"wg planu")}<br><b>Siłownia:</b> ${esc(r.silownia||"wg planu")}</div>
   ${r.reasons.length?`<p class="mini" style="margin:6px 0 0">${r.reasons.map(esc).join(" · ")}</p>`:""}</div></div>
   <div class="eyebrow" style="margin-top:14px">Jak się czujesz? – jedno dotknięcie</div>
   <div class="feel">${[[1,"źle"],[2,"słabo"],[3,"ok"],[4,"dobrze"],[5,"super"]].map(([n,f])=>`<button type="button" data-feel="${n}" class="${fe===n?"on":""}" aria-label="Samopoczucie ${n} z 5"><b>${n}</b><small>${f}</small></button>`).join("")}</div>
   <p class="mini" style="margin:8px 0 0">Obciążenie 7 dni: <b>${Math.round(lw[0])} AU</b> (tydzień wcześniej ${Math.round(lw[1])}) · liczone z planu, chyba że zmienisz.</p></div>
 </div>
 <h3 style="margin-top:24px">Trening ${isT?"dziś":"– najbliższy dzień planu"}</h3>${(()=>{const st=slalomDeficitStreak();const ph=["am","pm"].filter(k=>isPhys(ref[k])&&!/zjazd|ergometr|airbike|Bieg|rower|Narty|długiej łodzi/i.test(ref[k][1]));
  return st&&ph.length?`<div class="warn" style="margin:0 0 12px;padding:10px 12px;border-radius:10px"><b>Zrób w zjazdówce:</b> ${ph.map(k=>esc(ref[k][1].split(" – ")[0])).join(", ")}. Ostatnie 2 takie jednostki w slalomówce nie dobiły do progu (${st.map(q=>q.m+" min").join(", ")} powyżej 150). Cel tej sesji to tętno – technikę zostaw na inne jednostki.</div>`:""})()}
 ${sesList(ref).length?`<div class="grid g2">${sesCard("Rano",ref.am,ref.amd,ref.d,"am")}${sesCard("Popołudnie",ref.pm,ref.pmd,ref.d,"pm")}</div>`:`<div class="card" style="padding:14px 18px"><b>Dzień wolny.</b> <span class="muted">Odpoczynek – sen, jedzenie, spacer.</span></div>`}
 ${doneBar(ref)}
 ${ye&&isT&&dStatus(ye).k==="def"?`<div class="card" style="margin-top:14px;padding:12px 16px"><b>Wczoraj</b> <span class="mini">(${esc(typL(ye.am[0]))} · ${esc(typL(ye.pm[0]))})</span> – przyjąłem, że zrobione wg planu. Zmień, jeśli było inaczej.${doneBar(ye)}</div>`:""}
 ${tm?`<div class="card" style="margin-top:16px"><div class="eyebrow">Jutro · ${DOWL[pd(tm.d).getDay()]} ${f2(pd(tm.d))} · <span class="int ${tm.i}">${tm.i}</span></div><div>${typ(tm.am[0])} <b>${esc(tm.am[1])}</b></div><div style="margin-top:6px">${typ(tm.pm[0])} <b>${esc(tm.pm[1])}</b></div><a class="btn sm" style="margin-top:10px" href="#tydzien/${tm.w}">Cały tydzień →</a></div>`:""}${isT?nutriToday():""}${compactWeek(DAYS.filter(d=>d.w===ref.w).map(eff),"Ten tydzień – rano i popołudnie, kliknij dzień po szczegóły")}


 <details class="card" style="margin-top:16px" id="zgw"><summary style="cursor:pointer;font-weight:700;color:var(--accent)">Coś się zmieniło? Choroba, podróż, zmęczenie, opis toru – napisz normalnie</summary><div id="zg" style="margin-top:10px"></div></details>`);
 const z=R.zglos();const zc=z.querySelector(".card");if(zc){zc.classList.remove("card");v.querySelector("#zg").appendChild(zc)}
 v.addEventListener("click",e=>{const b=e.target.closest("[data-edit]");if(b)openEditor(b.dataset.edit)});
 return v};

/* ---------- WYKONANIE ---------- */
R.wykonanie=(arg)=>{const n=Math.min(120,+arg||21);const days=DAYS.filter(d=>pd(d.d)<=today&&pd(d.d)>addD(today,-n)).map(eff).reverse();
 const cnt={def:0,ok:0,alt:0,no:0};days.forEach(d=>{const s=dStatus(d);const o=OV[d.d]||{};if(s.k==="def")cnt.def++;else if(s.k==="ok")o.alt?cnt.alt++:cnt.ok++;else if(s.k==="no")cnt.no++});
 const v=el(`<h2>Wykonanie</h2><p class="lead"><b>Nie musisz niczego wpisywać.</b> Każdy miniony dzień liczy się jako zrobiony wg planu. Zmieniasz tylko wyjątki: <b>✕ Nie zrobiłem</b> albo <b>≈ Inaczej</b>. Ocena czucia 1–5 zajmuje sekundę i pomaga sprawdzić, po jakich treningach jesteś „ospały”.</p>
 <div class="kpis"><div class="kpi"><span>Wg planu (domyślnie)</span><b>${cnt.def}</b><span>dni bez zmian</span></div><div class="kpi a"><span>Potwierdzone</span><b>${cnt.ok}</b><span>zrobione wg planu</span></div><div class="kpi q"><span>Inaczej</span><b>${cnt.alt}</b><span>zmienione sesje</span></div><div class="kpi red"><span>Nie zrobione</span><b>${cnt.no}</b><span>z powodem</span></div></div>
 <div style="margin:14px 0;display:flex;gap:8px;flex-wrap:wrap">${[[21,"3 tygodnie"],[60,"2 miesiące"],[120,"4 miesiące"]].map(([k,t])=>`<a class="btn sm${k===n?" primary":""}" href="#wykonanie/${k}">${t}</a>`).join("")}</div>
 ${days.map(d=>{const o=OV[d.d]||{};const hr=hrAll().filter(x=>x.d===d.d);return `<div class="card wcard${d.d===isoL(today)?" today":""}" style="margin-top:10px;padding:12px 16px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${DOWL[pd(d.d).getDay()]} ${f2(pd(d.d))}</b><span class="int ${d.i}">${d.i}</span>${d.edited?`<span class="edited">zmieniony</span>`:""}${o.czucie?`<span class="gchip">czucie ${o.czucie}/5</span>`:""}${(o.well||{}).ogolne?`<span class="gchip">samopoczucie ${(o.well||{}).ogolne}/5</span>`:""}${hr.length?`<a class="gchip" href="#treningi" style="text-decoration:none">${hr.length} sesja z tętnem</a>`:""}</div>
 <div style="margin-top:6px">${typ(d.am[0])} ${esc(d.am[1])}</div>${verdict(d.d,"am",d.am)}<div style="margin-top:4px">${typ(d.pm[0])} ${esc(d.pm[1])}</div>${verdict(d.d,"pm",d.pm)}${nightChips(d.d)}${o.feel?`<div class="mini" style="margin-top:6px">${esc(o.feel)}</div>`:""}${doneBar(d)}</div>`}).join("")||`<p class="muted">Plan zaczyna się 28.09.2026.</p>`}`);
 v.addEventListener("click",e=>{const b=e.target.closest("[data-edit]");if(b)openEditor(b.dataset.edit)});
 return v};

if(!location.hash&&!SHARE){const last=st("view");if(last)location.hash=last}
window.addEventListener("hashchange",()=>st("view",location.hash));
route();
})();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
